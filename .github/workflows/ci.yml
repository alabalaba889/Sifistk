name: Sifistk CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm test
      - name: Package extension
        run: cd extension && zip -r ../sifistk-extension-${{ github.sha }}.zip .
      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: sifistk-extension-${{ github.sha }}
          path: sifistk-extension-${{ github.sha }}.zip
