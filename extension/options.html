<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sifistk — Configurações</title><link rel="stylesheet" href="options.css"></head><body><main><header><div><span class="eyebrow">SIFISTK</span><h1>Configurações</h1><p>Conexão, conta, permissões, preferências e recuperação.</p></div><strong id="version"></strong></header><section class="card"><h2>Servidor</h2><label>Origem da API<input id="apiOrigin" placeholder="https://seu-servidor"></label><button id="saveOrigin">Salvar servidor</button><span id="serverState"></span></section><section class="card"><h2>Conta</h2><div id="accountState"></div><div id="loginBox"><label>E-mail<input id="email" type="email" autocomplete="username"></label><label>Senha<input id="password" type="password" autocomplete="current-password"></label><button id="login">Entrar</button></div><button id="logout" class="danger">Sair</button></section><section class="card"><h2>Permissões opcionais</h2><p>Conceda somente quando uma função precisar delas.</p><div id="permissions"></div></section><section class="card"><h2>Preferências</h2><label class="row"><input id="autoSync" type="checkbox"> Sincronização automática</label><label class="row"><input id="notifications" type="checkbox"> Notificações</label><label class="row"><input id="saveReports" type="checkbox"> Salvar relatórios</label><label class="row"><input id="saveActionHistory" type="checkbox"> Histórico de ações</label><button id="saveSettings">Salvar preferências</button></section><section class="card"><h2>Diagnóstico e recuperação</h2><div class="actions"><button id="diagnostics">Gerar diagnóstico</button><button id="download">Baixar diagnóstico</button><button id="clear" class="danger">Limpar dados locais</button></div><pre id="out"></pre></section><script src="core.js"></script><script src="options.js"></script></main></body></html>
